sonar.projectKey=taskflow-api
sonar.projectName=TaskFlow API
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.exclusions=node_modules/**,coverage/**,test-results/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results/junit.xml

# Quality gate conditions applied on top of Sonar's built-in "Sonar way"
# gate: fail the gate (and the Jenkins stage) if new code drops below 80%
# coverage or introduces a duplication hotspot above 3%.
sonar.qualitygate.wait=true
