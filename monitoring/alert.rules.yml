groups:
  - name: taskflow-alerts
    rules:
      - alert: TaskFlowDown
        expr: up{job=~"taskflow-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow ({{ $labels.environment }}) is down"
          description: "Prometheus has not been able to scrape /metrics for over a minute."

      - alert: TaskFlowHighErrorRate
        expr: rate(taskflow_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TaskFlow ({{ $labels.environment }}) is returning elevated 5xx errors"
          description: "More than 5% of recent requests are failing with server errors."

      - alert: TaskFlowSlowResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TaskFlow ({{ $labels.environment }}) p95 latency above 1s"
          description: "95th percentile request latency has exceeded 1 second for 5 minutes."
